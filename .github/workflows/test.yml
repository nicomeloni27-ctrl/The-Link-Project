name: Link Project tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/auth.test.cjs tests/mcp.test.mjs tests/study.test.mjs tests/study-security.test.mjs
      - run: node --check api/mcp.js && node --check api/generate-study.js && node --check study-workspace.js && node --check cloud-documents.js && node --check app.js
  oauth-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Supabase OAuth discovery is enabled
        run: |
          node --input-type=module <<'NODE'
          const url='https://kkjlfvkbtcjkgourkowa.supabase.co/.well-known/oauth-authorization-server/auth/v1';
          const response=await fetch(url,{signal:AbortSignal.timeout(15000)});
          console.log('OAuth discovery HTTP status:',response.status);
          const payload=await response.json().catch(()=>null);
          console.log('OAuth metadata keys:', payload && Object.keys(payload).join(', '));
          if(!response.ok || !payload?.authorization_endpoint || !payload?.token_endpoint) {
            throw Error('Supabase OAuth discovery not ready or incomplete');
          }
          console.log('Supabase OAuth authorization server ready');
          NODE
